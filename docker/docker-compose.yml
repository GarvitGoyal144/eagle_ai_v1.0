version: '3.8'

services:
  mongodb:
    image: mongo:6.0
    container_name: eagle_ai_mongo
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db
    environment:
      - MONGO_INITDB_DATABASE=eagle_ai

  backend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.backend
    container_name: eagle_ai_backend
    restart: always
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - MONGO_URI=mongodb://mongodb:27017
      - DATABASE_NAME=eagle_ai
      - LLM_PROVIDER=${LLM_PROVIDER:-groq}
      - GROQ_API_KEY=${GROQ_API_KEY:-}
      - DEVICE=cpu
      - YOLO_MODEL=yolo11n.pt
      - CORS_ORIGINS=*
    depends_on:
      - mongodb
    volumes:
      - backend_data:/app/data

  frontend:
    build:
      context: ..
      dockerfile: docker/Dockerfile.frontend
      args:
        VITE_API_URL: http://localhost:8000
    container_name: eagle_ai_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend

volumes:
  mongo_data:
  backend_data:
